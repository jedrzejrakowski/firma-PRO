name: Testy

# Buduje rozwiązanie i uruchamia testy, w tym walidację generowanego
# dokumentu FA(3) oficjalnym schematem Ministerstwa Finansów.

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    name: Budowa i testy
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Instalacja .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pobranie zależności
        run: dotnet restore

      - name: Budowa
        # Ostrzeżenia są traktowane jak błędy (Directory.Build.props),
        # więc budowa nie przejdzie przy zaniedbanym kodzie.
        run: dotnet build --no-restore --configuration Release

      - name: Testy
        run: dotnet test --no-build --configuration Release --verbosity normal
